version: 2

project_name: codexometer

builds:
  - id: codexometer
    main: .
    binary: codexometer
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -buildvcs=false
      - -trimpath
    ldflags:
      - -s -w -X github.com/merefield/codexometer/internal/version.buildVersion={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
