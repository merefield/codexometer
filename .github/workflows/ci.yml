name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Experimental web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
      - name: Install, type-check and build frontend
        working-directory: web
        run: npm ci && npm run check && npm run build
      - name: Verify embedded assets match source
        run: test -z "$(git status --porcelain -- internal/web/dist)"
      - name: Build demo binary
        run: go build -trimpath -o codexometer .
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        working-directory: web
        run: npm test

  test:
    name: Go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Setup Bats
        if: runner.os == 'Linux'
        uses: bats-core/bats-action@4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Check formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Build
        run: go build -trimpath ./...

      - name: Test Unix release installer
        if: runner.os == 'Linux'
        run: bats test/install-release.bats

      - name: Test Windows release installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test/install-release.ps1
