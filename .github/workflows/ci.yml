name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Experimental web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install, type-check and build frontend
        working-directory: web
        run: npm ci && npm run check && npm run build
      - name: Verify embedded assets match source
        run: test -z "$(git status --porcelain -- internal/web/dist)"
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: make web-test

  test:
    name: Go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bats
        if: runner.os == 'Linux'
        uses: bats-core/bats-action@4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Check formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      # Keep all assertions and race instrumentation. Separate invocations
      # give the 17-locale rendering matrix its own package timeout budget.
      - name: Core tests (race and coverage)
        shell: bash
        run: |
          set -o pipefail
          go test -race -cover -json -timeout 10m -skip '^TestLocalisedScreens$' ./... | tee core-test-results.json

      - name: Localised screens (all locales, race and coverage)
        shell: bash
        run: |
          set -o pipefail
          go test -race -cover -json -timeout 10m -run '^TestLocalisedScreens$' ./internal/ui | tee locale-test-results.json

      - name: Preserve test results and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-tests-${{ matrix.os }}
          path: '*-test-results.json'
          retention-days: 7
          if-no-files-found: ignore

      - name: Build
        run: go build -trimpath ./...

      - name: Test Unix release installer
        if: runner.os == 'Linux'
        run: bats test/install-release.bats

      - name: Test Windows release installer (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test/install-release.ps1

      - name: Test Windows release installer (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./test/install-release.ps1
