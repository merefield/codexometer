name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-vulnerabilities:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check reachable Go vulnerabilities (Linux)
        # Do not silently scan a newer toolchain instead of the project's Go version.
        env:
          GOTOOLCHAIN: local
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  frontend-vulnerabilities:
    name: Frontend vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      # Audit the committed lockfile without installing or executing package scripts.
      - name: Runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: All dependencies including build tooling
        if: always()
        run: npm audit --audit-level=high
